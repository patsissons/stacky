name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @stacky/web exec playwright install --with-deps chromium
      - run: pnpm validate
        env:
          # also run the Docker integration tests (the runner has a Docker engine)
          STACKY_DOCKER_TESTS: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  self-update:
    # stacky updating (and rolling back) its own container on a real engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Self-update through a registry (pull + pin)
        run: SELF_E2E_MODE=registry scripts/self-update-e2e.sh
      - name: Self-update by redeploying an edited compose file
        run: SELF_E2E_MODE=local scripts/self-update-e2e.sh
