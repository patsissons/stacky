name: ci

on:
  pull_request:
    # release-please PRs only touch these; their bot-authored runs wait for an
    # approval nobody gives, and main-push CI (release.yml) covers the merge
    paths-ignore:
      - CHANGELOG.md
      - .release-please-manifest.json
      - package.json
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @stacky/web exec playwright install --with-deps chromium
      - run: pnpm validate
        env:
          # also run the Docker integration tests (the runner has a Docker engine)
          STACKY_DOCKER_TESTS: '1'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  self-update:
    # stacky updating (and rolling back) its own container on a real engine
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
        with:
          driver: docker
      - name: Self-update through a registry (pull + pin)
        run: SELF_E2E_MODE=registry scripts/self-update-e2e.sh
      - name: Self-update by redeploying an edited compose file
        run: SELF_E2E_MODE=local scripts/self-update-e2e.sh

  installer:
    # the one-line installer served at https://stacky.lgtm.page/install.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: shellcheck -s sh apps/site/public/install.sh
      - name: Build the image
        run: docker build -q -f docker/Dockerfile --build-arg STACKY_VERSION=0.0.0-ci -t stacky:ci .
      - name: Install with dash (as `curl … | sh` does on Debian/Ubuntu)
        run: |
          export STACKY_STACKS_DIR="$RUNNER_TEMP/stacks" STACKY_PORT=5105 STACKY_IMAGE=stacky:ci
          dash apps/site/public/install.sh
          curl -fsS localhost:5105/healthz | grep -q '"0.0.0-ci"'
      - name: Running it again updates in place
        run: |
          STACKY_STACKS_DIR="$RUNNER_TEMP/stacks" dash apps/site/public/install.sh
          curl -fsS localhost:5105/healthz
      - name: Rejects a port that is in use
        run: |
          if STACKY_STACKS_DIR="$RUNNER_TEMP/other" STACKY_PORT=5105 dash apps/site/public/install.sh; then
            echo "expected a port conflict error" && exit 1
          fi
