name: site

on:
  pull_request:
    paths:
      - apps/site/**
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  push:
    branches: [main]
    paths:
      - apps/site/**
      - pnpm-lock.yaml
      - .github/workflows/site.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-24.04
    # holds the Cloudflare secrets, so pull requests stay out of it
    environment: ${{ github.event_name != 'pull_request' && 'site' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @stacky/site...
      - name: Sync content types
        run: pnpm --filter @stacky/site typecheck
      - name: Build (includes link validation)
        run: pnpm --filter @stacky/site build
      - name: Check for Cloudflare credentials
        id: cf
        if: github.event_name != 'pull_request'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the site deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: cloudflare/wrangler-action@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/site
          packageManager: pnpm
          command: deploy
