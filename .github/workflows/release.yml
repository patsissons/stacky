name: release

# Every push to main publishes the `edge` image, after CI unless that CI would
# repeat a result already validated (see the gate below). When release-please
# cuts a release, the same run publishes semver + `latest`.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    needs: release-please
    # != 'false' so CI still runs if release-please or the gate fails
    if: ${{ !cancelled() && needs.release-please.outputs.run_ci != 'false' }}
    uses: ./.github/workflows/ci.yml

  release-please:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      run_ci: ${{ steps.gate.outputs.run_ci }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Lives in this job so that it doesn't bill a job of its own. CI is skipped
      # only for a tree PR CI already passed, or a release merge (version files
      # only) on top of a green run; anything else, API errors included, runs it.
      - name: Decide whether this push needs CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CREATED: ${{ steps.rp.outputs.release_created }}
        run: |
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" --jq "$2" 2>/dev/null || true; }
          succeeded() { [ "$(api "actions/workflows/$1/runs?head_sha=$2&status=success&per_page=1" .total_count)" -gt 0 ] 2>/dev/null; }

          run_ci=true
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$RELEASE_CREATED" = true ]; then
              parent="$(api "commits/$GITHUB_SHA" '.parents[0].sha')"
              if [ -n "$parent" ] && succeeded release.yml "$parent"; then
                echo "::notice::Release merge on top of a green run; skipping CI."
                run_ci=false
              fi
            else
              head="$(api "commits/$GITHUB_SHA/pulls" '[.[] | select(.merged_at != null)][0].head.sha // empty')"
              if [ -n "$head" ]; then
                tree="$(api "git/commits/$GITHUB_SHA" .tree.sha)"
                if [ -n "$tree" ] && [ "$tree" = "$(api "git/commits/$head" .tree.sha)" ] && succeeded ci.yml "$head"; then
                  echo "::notice::PR CI already passed on this exact tree; skipping CI."
                  run_ci=false
                fi
              fi
            fi
          fi
          echo "run_ci=$run_ci" >> "$GITHUB_OUTPUT"

  image:
    needs: [ci, release-please]
    # !cancelled() because a skipped `ci` would otherwise skip this job too
    if: ${{ !cancelled() && needs.release-please.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.ci.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      RELEASE: ${{ needs.release-please.outputs.release_created == 'true' }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image names and version
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          images="ghcr.io/${owner}/stacky"
          if [ "$HAS_DOCKERHUB" = "true" ]; then
            images="${images}"$'\n'"docker.io/${{ secrets.DOCKERHUB_USERNAME }}/stacky"
          fi
          {
            echo "images<<EOF"
            echo "$images"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$RELEASE" = "true" ]; then
            echo "version=${TAG_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v4
        if: env.HAS_DOCKERHUB == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.names.outputs.images }}
          flavor: |
            latest=false
          tags: |
            type=edge,branch=main,enable=${{ env.RELEASE != 'true' }}
            type=sha,format=short
            type=semver,pattern={{version}},value=${{ env.TAG_NAME }},enable=${{ env.RELEASE == 'true' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG_NAME }},enable=${{ env.RELEASE == 'true' }}
            type=semver,pattern={{major}},value=${{ env.TAG_NAME }},enable=${{ env.RELEASE == 'true' && !startsWith(env.TAG_NAME, 'v0.') }}
            type=raw,value=latest,enable=${{ env.RELEASE == 'true' }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            STACKY_VERSION=${{ steps.names.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: mode=max
          sbom: true

      - uses: peter-evans/dockerhub-description@v5
        if: env.HAS_DOCKERHUB == 'true' && env.RELEASE == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/stacky
          short-description: A modern, compose-first Docker stack manager
          readme-filepath: ./README.md
