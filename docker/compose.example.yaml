# Put this file at /opt/stacks/stacky/compose.yaml and run `docker compose up -d`
# once from that directory. After that, stacky manages (and updates) itself.
services:
  stacky:
    image: ghcr.io/patsissons/stacky:latest
    restart: unless-stopped
    ports:
      - 5005:5005
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
      # The stacks directory MUST be mounted at the same path inside the
      # container as on the host (compose resolves relative paths client-side).
      - /opt/stacks:/opt/stacks
    # Optional settings. STACKY_STACKS_DIR defaults to /opt/stacks, so only set it if you
    # mount a different path above.
    # environment:
    #   # Seed the admin account instead of using the first-run setup page.
    #   STACKY_ADMIN_USER: admin
    #   STACKY_ADMIN_PASSWORD: change-me
    #   # Disable built-in auth when an authenticating reverse proxy sits in front.
    #   STACKY_AUTH_DISABLED: "true"
    #   # Host for published-port links when stacky is served on another hostname
    #   # (e.g. https://stacky.docker.lan while the ports live on docker.lan).
    #   STACKY_DOCKER_HOST: docker.lan
    #   # Name of this stacky in notifications (defaults to the Docker host's name).
    #   STACKY_DISPLAY_NAME: nas
